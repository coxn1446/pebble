# Cloud Build: one image + deploy pebble-qa (DB_SCHEMA=qa).
#   npm run deploy:qa
#
# Update _CLOUDSQL_INSTANCE and _DEFAULT_CLIENT_URL for your GCP project.

substitutions:
  _CLOUD_RUN_REGION: us-central1
  _CLOUDSQL_REGION: northamerica-northeast1
  _CLOUDSQL_INSTANCE: pebble-db
  _DEFAULT_CLIENT_URL: https://pebble-qa-placeholder.run.app

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pebble', '.']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pebble']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - pebble-qa
      - --image=gcr.io/$PROJECT_ID/pebble
      - --region=$_CLOUD_RUN_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --memory=256Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --add-cloudsql-instances=$PROJECT_ID:$_CLOUDSQL_REGION:$_CLOUDSQL_INSTANCE
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,NODE_ENV=qa,DB_SCHEMA=qa,DEFAULT_CLIENT_URL=$_DEFAULT_CLIENT_URL
    id: deploy-qa

images:
  - 'gcr.io/$PROJECT_ID/pebble'
